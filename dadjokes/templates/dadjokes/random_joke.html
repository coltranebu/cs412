{% extends 'dadjokes/base.html' %}
{% load static %}

    {% block content %}
    
    <h1>Joke:</h1>
    <p>{{joke.text}}</p>
    <ul>
        <li>Author: {{joke.name}}</li>
        <li>Timestamp: {{joke.timestamp}}</li>
    </ul>
    <h1>Picture:</h1>
    <img src={{picture.image_url}}>
    <ul>
        <li>Timestamp: {{picture.timestamp}}</li>
    </ul>
    
    {% endblock %}~
