{% extends 'mini_insta/base.html' %}

    {% block content %}
    
    <main>
        <!-- Hyperlink to return to profile -->
        <a href="{% url 'show_profile' profile.pk %}">
            <p>Back</p>
        </a>
        <br>
        <h1>Update {{profile.display_name}} (@{{profile.username}})</h1>

        <!-- Form to update a profile -->
        <form action="{% url 'update_profile' profile.pk %}" method="POST">
            {% csrf_token %}
            <table>
                {{form.as_table}}
            </table>
            <input type="submit" name="submit" value="Update">
        </form>
        
        <!-- Cancel and return to profile -->
        <form action="{% url 'show_profile' profile.pk %}" method="GET">
            <input type="submit" name="submit" value="Cancel">
        </form>
        

    </main>
        
    {% endblock %}
