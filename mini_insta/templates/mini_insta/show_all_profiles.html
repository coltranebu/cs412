{% extends 'mini_insta/base.html' %}

    {% block content %}
    
    <main>
        {% for profile in profiles %}
            <div>
                <div>
                    <h2>{{profile.display_name}}</h2>
                    <h3>{{profile.username}}</h3>
                </div>
                <a href="{% url 'show_profile' profile.pk %}"><img src="{{profile.profile_image_url}}"></a>
            </div>
            <hr>
            {% endfor %}
    </main>
        
    {% endblock %}
