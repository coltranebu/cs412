This is the "Show All Profiles" page, which displays every profile in the
database in a grid.
-->
{% extends 'mini_insta/base.html' %}

    {% block content %}
    
    <main>
        <div class="grid-container">

            <!-- For loop iterating through every profile and displaying it -->
            {% for profile in profiles %}
                <div class="grid-item">

                    <!-- Display name -->
                    <span>{{profile.display_name}}</span>

                    <!-- Display image in the form of a link to profile -->
                    <a href="{% url 'show_profile' profile.pk %}">
                        <img src="{{profile.profile_image_url}}"></a>
                </div>
            {% endfor %}

        </div>

    </main>
        
    {% endblock %}
