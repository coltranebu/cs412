This page allows the user to unfollow another profile.
-->
{% extends 'mini_insta/base.html' %}

    {% block content %}
    
    <main>
        <!-- Hyperlink to return to profile -->
        <a href="{% url 'show_profile' other_profile.pk %}">
            <p>Back</p>
        </a>
        <br>
        <h1>Unfollow {{other_profile.display_name}}?</h1>

        <!-- Form to create a Follow -->
        <form action="{% url 'delete_follow' other_profile.pk %}" 
        method="POST">
            {% csrf_token %}
            <input type="submit" name="submit" value="Yes">
        </form>

        <!-- Cancel -->
        <form action="{% url 'show_profile' profile.pk %}" method="GET">
            <input type="submit" value="Cancel">
        </form>
    </main>
        
    {% endblock %}
