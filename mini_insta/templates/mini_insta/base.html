{% load static %}
<html>
    <head>
        <title>Mini Insta</title>
        <link rel="stylesheet" href="{% static 'mini_insta/style.css' %}">
    </head>
    <body>

        <!-- Header with title and navigation -->
        <header>
            <h1>Mini Insta</h1>
            <nav>
                <ul>
                    <li><a href="{% url 'show_all_profiles' %}">
                        Show All Profiles</a></li>
                </ul>
            </nav>
        </header>


        {% block content %}
        {% endblock %}

        <!-- Persistent link to homepage -->
        <footer>
            <a href="{% url 'show_all_profiles' %}">
                <p>Show all profiles</p>
            </a>
        </footer>
    </body>
</html>
