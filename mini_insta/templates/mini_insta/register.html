{% extends 'mini_insta/base.html' %}

    {% block content %}
    
    <main>
        
        <h1>Register for a new account</h1>

        <!-- Registration form -->
        <form action="{% url 'register' %}" method="POST">
            {% csrf_token %}
            {{form}}
            <input type="submit">
        </form>

    </main>
        
    {% endblock %}
