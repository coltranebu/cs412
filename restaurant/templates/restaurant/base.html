{% load static %}

<html>
    <head>
        <title>Bay State Blenheim Dispensary</title>
        <link rel="stylesheet" href="{% static 'restaurant/style.css' %}">

        <!-- Google Font for Header -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- To my knowledge, this (23) is the only line of code I have written
        which surpasses eighty characters in width. I have not found any way to
        force a line break in a URL in the code without breaking it. Is there
        a way to do this? Consider this a potentially necessary break in proper
        style. -->
        <link href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent&display=swap" 
            rel="stylesheet">
    </head>
    <body>

        <!-- Navigation -->
        <nav>
            <ol>
                <li><a href="{% url 'main' %}">Homepage</a></li>
                <li><a href="{% url 'order' %}">Order</a></li>
            </ol>
        </nav>
    
        <!-- Website header -->
        <h1>Bay State Blenheim Dispensary</h1>
        

        {% block content %}
        {% endblock %}

    </body>

</html>
